name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填完整——版本与日志能省掉好几轮来回。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: Plugins 页里本插件显示的行版本
      placeholder: 1.5.4
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: DSH NEXT 壳版本 + Harness 内核版本
      placeholder: 2.0.22-next / 内核 0.2.2-rc.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - npm（registry.npmjs.org）
        - GitHub tag / commit
        - 本地目录 / tarball（junction）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开会话 X
        2. 点顶栏的 …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 探针日志（脱敏后）
      description: |
        Plugins → 更好的会话顶栏 → 配置 → 打开「探针日志」，复现一次，贴
        `[bst-dom]` / `[bst-chip]` / `[bst-perf]` / `[bst-picker]` 相关行。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已在最新版本上复现
          required: true
        - label: 日志已脱敏（不含真实用户名 / 路径 / 密钥）
          required: true
